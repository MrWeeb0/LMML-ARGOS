name: Kazakhstan Materials Check
on:
  push:
    branches: [kazakhstan-stamp-lab]
    paths:
      - Kazakhstan/Stamp_of_Disapproval/validate_materials.py
      - .github/workflows/kazakhstan-materials.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kazakhstan-stamp-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy Pillow
      - run: python Kazakhstan/Stamp_of_Disapproval/validate_materials.py
      - name: Publish structural verification record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Kazakhstan/Stamp_of_Disapproval/material-checks.json
          git diff --cached --quiet || git commit -m "Verify Kazakhstan saved materials without asserting a flag [skip ci]"
          git push origin HEAD:kazakhstan-stamp-lab
