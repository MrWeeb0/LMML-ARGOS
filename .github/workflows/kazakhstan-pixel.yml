name: Kazakhstan Pixel Detector
on:
  push:
    branches: [kazakhstan-stamp-lab]
    paths:
      - Kazakhstan/Stamp_of_Disapproval/pixel_model.py
      - Kazakhstan/Stamp_of_Disapproval/pixel_detect.py
      - .github/workflows/kazakhstan-pixel.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kazakhstan-stamp-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy Pillow opencv-python-headless scikit-learn joblib gdown PyYAML
      - name: Download and verify challenge inputs
        run: python Kazakhstan/Stamp_of_Disapproval/download.py
      - name: Train and validate the pixel detector
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -u Kazakhstan/Stamp_of_Disapproval/pixel_model.py
          python -m pip freeze > Kazakhstan/Stamp_of_Disapproval/environment.txt
      - name: Detect all album regions
        run: python -u Kazakhstan/Stamp_of_Disapproval/pixel_detect.py
      - name: Preserve detector materials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazakhstan-pixel-materials
          path: |
            Kazakhstan/Stamp_of_Disapproval/pixel-output/
            Kazakhstan/Stamp_of_Disapproval/pixel-validation.json
            Kazakhstan/Stamp_of_Disapproval/pixel-detector.pt
            Kazakhstan/Stamp_of_Disapproval/environment.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Publish generated results on the investigation branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Kazakhstan/Stamp_of_Disapproval/pixel-output Kazakhstan/Stamp_of_Disapproval/pixel-validation.json Kazakhstan/Stamp_of_Disapproval/pixel-detector.pt Kazakhstan/Stamp_of_Disapproval/environment.txt
          git diff --cached --quiet || git commit -m "Record Kazakhstan pixel detections and validation [skip ci]"
          git push origin HEAD:kazakhstan-stamp-lab
