name: Japan repeating pattern inspection
on:
  push:
    paths:
      - '.github/workflows/japan-phase.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Japan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r Japan/requirements.txt requests
      - uses: actions/download-artifact@v4
        with:
          name: japan-analysis
          path: Japan/remote-artifact
          run-id: 43665582749
          github-token: ${{ github.token }}
      - run: python Japan/phase_lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-repeating-patterns
          path: Japan/phase-results/
          retention-days: 14
